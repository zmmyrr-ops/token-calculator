services:
  backend:
    image: mendao-backend:${RELEASE_ID:?release required}
    env_file: ${APP_ENV_FILE:?environment required}
    environment:
      NODE_ENV: production
      DATABASE_FILE: /app/storage/mendao.sqlite
      NEWS_DATA_FILE: /app/storage/news.json
    volumes:
      - ${STORAGE_DIR:?storage required}:/app/storage
    restart: unless-stopped
    init: true
    mem_limit: 512m
    cpus: 0.65
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    image: mendao-frontend:${RELEASE_ID:?release required}
    ports: ["127.0.0.1:${FRONTEND_PORT:?port required}:80"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
