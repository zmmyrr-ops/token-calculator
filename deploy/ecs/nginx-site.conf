# Keep the verification URL on the exact registered hostname (HTTP 200).
map "$host:$uri" $mendao_redirect_www {
    default 0;
    ~^www\.ruming\.top:/baidu_verify_codeva-dNjacCJLDs\.html$ 0;
    ~^www\.ruming\.top: 1;
}

server {
    listen 80;
    server_name www.ruming.top ruming.top;
    if ($mendao_redirect_www) { return 308 https://ruming.top$request_uri; }
    root /var/www/html/dist;
    index index.html;

    location / {
        return 301 https://ruming.top$request_uri;
    }

    location /nl-online {
        alias /var/www/nl-online;
        index index.html;
        try_files $uri $uri/ /nl-online/index.html;
    }

    location = /staging { return 301 https://ruming.top/staging/; }
    location ^~ /staging/ { return 301 https://ruming.top$request_uri; }

    location /api/ { return 301 https://ruming.top$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.ruming.top ruming.top;
    if ($mendao_redirect_www) { return 308 https://ruming.top$request_uri; }
    root /var/www/html/dist;
    index index.html;

    ssl_certificate /etc/nginx/ssl/www.ruming.top.pem;
    ssl_certificate_key /etc/nginx/ssl/www.ruming.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location /nl-online {
        alias /var/www/nl-online;
        index index.html;
        try_files $uri $uri/ /nl-online/index.html;
    }

    location = /staging { return 301 /staging/; }
    location ^~ /staging/ {
        auth_basic "AI Mendao staging";
        auth_basic_user_file /etc/nginx/staging.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # Public bootstrap data: compress without changing freshness or admin APIs.
    location = /api/v1/bootstrap {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/json;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
