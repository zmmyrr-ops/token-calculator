map $uri $mendao_referrer {
    default strict-origin-when-cross-origin;
    ~^/(staging/)?ai-eyes(/|$) no-referrer;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $mendao_referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ~ ^/(staging/)?ai-eyes(/|$) {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /staging/api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location = /staging/ { proxy_pass http://backend:4000; }
    location /staging/ { try_files $uri @published_html; expires -1; }
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location ~ ^/(sitemap.xml|robots.txt)$ { proxy_pass http://backend:4000; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /tokenizers/ { try_files $uri =404; expires 1y; }
    location = / { proxy_pass http://backend:4000; }
    location / { try_files $uri @published_html; expires -1; }
    location @published_html {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
