# Domain supplied by the owner. Install the actual TLS certificate at the paths below before enabling.
server {
    listen 80;
    server_name ruming.top;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name ruming.top;
    ssl_certificate /etc/nginx/certs/ruming.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/ruming.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
